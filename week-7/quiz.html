<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 7 Quiz — Weather API, JSON &amp; Charts</title>
<style>
  :root{ --ok:#10b981; --no:#ef4444; --accent:#6366f1; --muted:#9a9a9a; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#fff; font-family:'Segoe UI',system-ui,sans-serif; color:#111;
    display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:54px 20px; }
  h1{ font-size:13px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:#999; margin-bottom:8px; }
  h2{ font-size:26px; font-weight:600; letter-spacing:-.02em; text-align:center; margin-bottom:6px; }
  .subtitle{ font-size:13px; color:var(--muted); margin-bottom:30px; text-align:center; }
  .wrap{ width:100%; max-width:600px; }
  .scorebar{ position:sticky; top:0; background:#fff; z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; margin-bottom:14px; border-bottom:1px solid #f0f0f4; }
  .score{ font-size:13px; font-weight:600; color:#555; } .score b{ color:var(--accent); font-size:15px; }
  .reset{ font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid #e3e3ea; background:#fff; color:#666; border-radius:9px; padding:6px 13px; transition:all .15s; }
  .reset:hover{ border-color:#ccc; color:#222; }
  .q{ border:1.5px solid #ececf2; border-radius:16px; padding:20px 18px; margin-bottom:20px; }
  .q-num{ font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  .q-text{ font-size:15.5px; font-weight:600; margin:5px 0 13px; letter-spacing:-.01em; }
  .code{ background:#1e2030; border-radius:10px; padding:12px 14px; margin-bottom:15px; font-family:'SF Mono','Consolas',monospace; font-size:12.5px; line-height:1.75; color:#d7dce8; overflow-x:auto; }
  .t-name{color:#89ddff}.t-op{color:#c792ea}.t-str{color:#c3e88d}.t-num{color:#f78c6c}.t-fn{color:#ffcb6b}.t-punc{color:#9aa4c0}.t-kw{color:#c792ea;font-weight:600}.t-com{color:#5a6080}
  .opts{ display:flex; flex-direction:column; gap:9px; }
  .opt{ display:flex; align-items:center; gap:10px; text-align:left; width:100%; font-family:'SF Mono','Consolas',monospace; font-size:13px; color:#333; background:#fff; border:1.5px solid #e6e6ee; border-radius:10px; padding:11px 13px; cursor:pointer; transition:.15s; }
  .opt:hover:not(:disabled){ border-color:#c7c7d6; } .opt:active:not(:disabled){ transform:scale(.99); }
  .opt .mk{ width:18px; height:18px; border-radius:50%; border:2px solid #d3d3df; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-family:'Segoe UI',sans-serif; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--ok); background:color-mix(in srgb,var(--ok) 8%,#fff); color:#0a6b4d; } .opt.correct .mk{ background:var(--ok); border-color:var(--ok); }
  .opt.wrong{ border-color:var(--no); background:color-mix(in srgb,var(--no) 8%,#fff); color:#a31818; } .opt.wrong .mk{ background:var(--no); border-color:var(--no); }
  .explain{ font-size:12.5px; color:#666; margin-top:12px; line-height:1.5; display:none; } .explain.show{ display:block; } .explain b{ color:#222; }
  .q.answered.right{ border-color:color-mix(in srgb,var(--ok) 40%,#fff); } .q.answered.miss{ border-color:color-mix(in srgb,var(--no) 35%,#fff); }
  .result{ text-align:center; font-size:15px; font-weight:600; color:#111; margin-top:6px; padding:16px; border-radius:14px; background:#f6f7fb; display:none; } .result.show{ display:block; } .result span{ font-size:24px; display:block; margin-bottom:4px; }
  @media (max-width:480px){ body{ padding:40px 14px; } h2{ font-size:21px; } .code{ font-size:11px; } }
</style>
</head>
<body>
  <h1>Python 3 · Week 7</h1>
  <h2>Quick Quiz</h2>
  <div class="subtitle">8 short questions on the weather API, JSON &amp; charts</div>
  <div class="wrap">
    <div class="scorebar"><div class="score">Score: <b id="score">0</b> / <span id="total">8</span></div><button class="reset" id="reset">↺ Reset</button></div>
    <div id="quiz"></div>
    <div class="result" id="result"></div>
  </div>
<script>
const QUIZ=[
  {
    q:'In this web address, where do the settings begin?',
    code:'<span class="t-str">https://api.open-meteo.com/v1/forecast</span><span class="t-punc">?</span><span class="t-name">latitude</span><span class="t-op">=</span><span class="t-num">52.52</span>',
    options:['Right after the ?','At the very start','After .com','There are no settings'], answer:0,
    explain:'The address says which website to ask. Everything after the <b>?</b> is your settings — here, which place you want.'
  },
  {
    q:'What is the & doing here?',
    code:'<span class="t-punc">?</span><span class="t-name">latitude</span><span class="t-op">=</span><span class="t-num">52.52</span><span class="t-punc">&amp;</span><span class="t-name">longitude</span><span class="t-op">=</span><span class="t-num">13.41</span>',
    options:['Adding the numbers together','Separating one setting from the next','Making the request faster','Nothing, you can delete it'], answer:1,
    explain:'<b>&amp;</b> is just a separator, like a comma. Here you are sending two settings: latitude <b>and</b> longitude.'
  },
  {
    q:'The weather website sends this back. What is this format called?',
    code:'<span class="t-punc">{</span> <span class="t-str">"hourly"</span><span class="t-punc">: {</span> <span class="t-str">"temperature_2m"</span><span class="t-punc">: [</span><span class="t-num">18.5</span><span class="t-punc">,</span> <span class="t-num">18.3</span><span class="t-punc">] } }</span>',
    options:['CSV','Excel','JSON','PDF'], answer:2,
    explain:'This is <b>JSON</b>. It looks a lot like a Python dictionary, and that is exactly what Python turns it into.'
  },
  {
    q:'Which list holds the clock times?',
    code:'<span class="t-str">"hourly"</span><span class="t-punc">: {</span>\n&nbsp;&nbsp;<span class="t-str">"time"</span><span class="t-punc">: [</span><span class="t-str">"2026-08-16T00:00"</span><span class="t-punc">,</span> <span class="t-str">"2026-08-16T01:00"</span><span class="t-punc">],</span>\n&nbsp;&nbsp;<span class="t-str">"temperature_2m"</span><span class="t-punc">: [</span><span class="t-num">18.5</span><span class="t-punc">,</span> <span class="t-num">18.3</span><span class="t-punc">]</span>\n<span class="t-punc">}</span>',
    options:['"temperature_2m"','"time"','"hourly"','Both of them'], answer:1,
    explain:'<b>"time"</b> holds the hours, <b>"temperature_2m"</b> holds the degrees. Two separate lists.'
  },
  {
    q:'So which temperature happened at 01:00?',
    code:'<span class="t-str">"time"</span><span class="t-punc">: [</span><span class="t-str">"…T00:00"</span><span class="t-punc">,</span> <span class="t-str">"…T01:00"</span><span class="t-punc">,</span> <span class="t-str">"…T02:00"</span><span class="t-punc">]</span>\n<span class="t-str">"temperature_2m"</span><span class="t-punc">: [</span><span class="t-num">18.5</span><span class="t-punc">,</span> <span class="t-num">18.3</span><span class="t-punc">,</span> <span class="t-num">17.6</span><span class="t-punc">]</span>',
    options:['18.5','18.3','17.6','You cannot tell'], answer:1,
    explain:'The lists line up by <b>position</b>. 01:00 is the 2nd time, so you take the 2nd temperature: <b>18.3</b>.'
  },
  {
    q:'What does marker="o" put on the chart?',
    code:'<span class="t-name">ax</span><span class="t-punc">.</span><span class="t-fn">plot</span><span class="t-punc">(</span><span class="t-name">df</span><span class="t-punc">[</span><span class="t-str">"date"</span><span class="t-punc">],</span> <span class="t-name">df</span><span class="t-punc">[</span><span class="t-str">"temperature_2m"</span><span class="t-punc">],</span> <span class="t-name">marker</span><span class="t-op">=</span><span class="t-str">"o"</span><span class="t-punc">)</span>',
    options:['A small circle on every point','A title','A grid','The letter o'], answer:0,
    explain:'Each circle is one real measurement. The line just connects the dots.'
  },
  {
    q:'You ask for 2 days of hourly weather. How many temperatures come back?',
    code:'<span class="t-str">"hourly"</span><span class="t-punc">:</span> <span class="t-str">"temperature_2m"</span><span class="t-punc">,</span>\n<span class="t-str">"forecast_days"</span><span class="t-punc">:</span> <span class="t-num">2</span>',
    options:['2','24','48','120'], answer:2,
    explain:'One number per hour: 2 days × 24 hours = <b>48</b>. Ask for 16 days and you get 384.'
  },
  {
    q:'Which line of this script actually draws the picture?',
    code:'<span class="t-num">1</span>&nbsp;&nbsp;<span class="t-name">response</span> <span class="t-op">=</span> <span class="t-name">requests</span><span class="t-punc">.</span><span class="t-fn">get</span><span class="t-punc">(</span><span class="t-name">url</span><span class="t-punc">)</span>\n<span class="t-num">2</span>&nbsp;&nbsp;<span class="t-name">data</span> <span class="t-op">=</span> <span class="t-name">response</span><span class="t-punc">.</span><span class="t-fn">json</span><span class="t-punc">()</span>\n<span class="t-num">3</span>&nbsp;&nbsp;<span class="t-name">df</span> <span class="t-op">=</span> <span class="t-name">pd</span><span class="t-punc">.</span><span class="t-fn">DataFrame</span><span class="t-punc">(</span><span class="t-name">data</span><span class="t-punc">[</span><span class="t-str">"hourly"</span><span class="t-punc">])</span>\n<span class="t-num">4</span>&nbsp;&nbsp;<span class="t-name">plt</span><span class="t-punc">.</span><span class="t-fn">plot</span><span class="t-punc">(</span><span class="t-name">df</span><span class="t-punc">[</span><span class="t-str">"time"</span><span class="t-punc">],</span> <span class="t-name">df</span><span class="t-punc">[</span><span class="t-str">"temperature_2m"</span><span class="t-punc">])</span>',
    options:['Line 1','Line 2','Line 3','Line 4'], answer:3,
    explain:'Line 1 asks, line 2 unpacks, line 3 makes a table, and <b>line 4</b> draws it. Same order as the six boxes in Step 1.'
  }
];
const quizEl=document.getElementById('quiz'),scoreEl=document.getElementById('score'),totalEl=document.getElementById('total'),resultEl=document.getElementById('result');
const TOTAL=QUIZ.length; let answered=new Array(TOTAL).fill(false), score=0; totalEl.textContent=TOTAL;
function build(){
  quizEl.innerHTML='';
  QUIZ.forEach((item,qi)=>{
    const card=document.createElement('div'); card.className='q'; card.id='q'+qi;
    card.innerHTML=`<div class="q-num">Question ${qi+1}</div><div class="q-text">${item.q}</div>`+
      (item.code?`<pre class="code">${item.code}</pre>`:'')+
      `<div class="opts">${item.options.map((o,oi)=>`<button class="opt" data-q="${qi}" data-o="${oi}"><span class="mk"></span><span>${o}</span></button>`).join('')}</div>`+
      `<div class="explain" id="ex${qi}">${item.explain}</div>`;
    quizEl.appendChild(card);
  });
  quizEl.querySelectorAll('.opt').forEach(b=> b.addEventListener('click', choose));
}
function choose(e){
  const btn=e.currentTarget, qi=+btn.dataset.q, oi=+btn.dataset.o;
  if(answered[qi]) return; answered[qi]=true;
  const card=document.getElementById('q'+qi), correct=QUIZ[qi].answer;
  card.querySelectorAll('.opt').forEach((o,i)=>{ o.disabled=true;
    if(i===correct){ o.classList.add('correct'); o.querySelector('.mk').textContent='\u2713'; }
    if(i===oi && oi!==correct){ o.classList.add('wrong'); o.querySelector('.mk').textContent='\u2715'; } });
  card.classList.add('answered', oi===correct?'right':'miss');
  document.getElementById('ex'+qi).classList.add('show');
  if(oi===correct){ score++; scoreEl.textContent=score; }
  if(answered.every(Boolean)) showResult();
}
function showResult(){
  let emoji,text;
  if(score===TOTAL){ emoji='🎉'; text=`Perfect! ${score} / ${TOTAL} — Week 7 mastered.`; }
  else if(score/TOTAL>=0.6){ emoji='👍'; text=`Nice — ${score} / ${TOTAL}. Almost there!`; }
  else { emoji='📘'; text=`${score} / ${TOTAL} — replay the lessons, then retry.`; }
  resultEl.innerHTML=`<span>${emoji}</span>${text}`; resultEl.classList.add('show');
}
function reset(){ answered=new Array(TOTAL).fill(false); score=0; scoreEl.textContent='0'; resultEl.classList.remove('show'); build(); window.scrollTo({top:0,behavior:'smooth'}); }
document.getElementById('reset').addEventListener('click', reset);
build();
</script>
</body>
</html>
